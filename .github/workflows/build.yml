name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Bundled Binaries (Poppler & Tesseract)
      run: |
        # 1. تحميل وتجهيز Poppler المحمول
        curl -L -o poppler.zip https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip
        powershell Expand-Archive -Path poppler.zip -DestinationPath bin_temp
        New-Item -ItemType Directory -Force -Path bin/poppler
        Get-ChildItem -Path bin_temp/*/* | Copy-Item -Destination bin/poppler -Recurse -Force
        Remove-Item -Recurse -Force bin_temp, poppler.zip

        # 2. تحميل وتجهيز Tesseract OCR Portable الكامل
        curl -L -o tesseract.zip https://github.com/UB-Mannheim/tesseract/wiki/download/tesseract-ocr-w64-setup-v5.3.3.20231005.exe
        # استخدام النسخة المحمولة أو سحب الثنائيات المباشرة
        curl -L -o tess_bin.zip https://github.com/tesseract-ocr/tesseract/releases/download/5.3.3/tesseract-5.3.3-win64.zip
        powershell Expand-Archive -Path tess_bin.zip -DestinationPath bin/tesseract
        Remove-Item -Force tess_bin.zip

        # 3. تحميل ملفات اللغات لـ OCR (عربي وإنجليزي)
        New-Item -ItemType Directory -Force -Path bin/tesseract/tessdata
        curl -L -o bin/tesseract/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
        curl -L -o bin/tesseract/tessdata/ara.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata

    - name: Build Executable with PyInstaller Direct
      run: |
        # حزم كافة المكتبات بالكامل وتفادي أخطاء No module named
        $COLLECT_FLAGS = "--collect-all customtkinter --collect-all PIL --collect-all fitz --collect-all pytesseract --collect-all img2pdf --collect-all pypdf --collect-all pdfplumber --collect-all pandas --collect-all openpyxl --collect-all arabic_reshaper --collect-all bidi --copy-metadata img2pdf --copy-metadata pdfplumber"

        if (Test-Path "assets/app_icon.ico") {
            Invoke-Expression "pyinstaller --noconfirm --onedir --windowed --name 'DocNexus' --icon='assets/app_icon.ico' $COLLECT_FLAGS --add-data 'bin;bin' --add-data 'assets;assets' main.py"
        } elseif (Test-Path "app_icon.ico") {
            Invoke-Expression "pyinstaller --noconfirm --onedir --windowed --name 'DocNexus' --icon='app_icon.ico' $COLLECT_FLAGS --add-data 'bin;bin' --add-data 'app_icon.ico;.' main.py"
        } else {
            Invoke-Expression "pyinstaller --noconfirm --onedir --windowed --name 'DocNexus' $COLLECT_FLAGS --add-data 'bin;bin' main.py"
        }

    - name: Compress Build Output
      run: |
        powershell Compress-Archive -Path dist/DocNexus -DestinationPath dist/DocNexus-Windows.zip

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DocNexus-Windows-Application
        path: dist/DocNexus-Windows.zip
